[project]
name = "auk-t8"
version = "2.0.2"
description = "Native ComfyUI V3 nodes for AuK speech generation and editing."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "transformers>=4.52,<5",
    "qwen-omni-utils>=0.0.9",
    "omegaconf>=2.3,<3",
    "torchdiffeq>=0.2.5",
    "x-transformers>=1.31.14,<3",
    "safetensors>=0.4",
    "accelerate>=0.33",
]
classifiers = [
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Repository = "https://github.com/T8mars/Comfyui-Auk-T8"
Documentation = "https://github.com/T8mars/Comfyui-Auk-T8#readme"
"Chinese Documentation" = "https://github.com/T8mars/Comfyui-Auk-T8/blob/main/README_CN.md"
"Model Weights" = "https://huggingface.co/t8star/Auk-Comfy"
"Bug Tracker" = "https://github.com/T8mars/Comfyui-Auk-T8/issues"

[tool.comfy]
PublisherId = "t8star"
DisplayName = "AuK · T8star-Aix"
Icon = "https://raw.githubusercontent.com/T8mars/Comfyui-Auk-T8/main/assets/icon.svg"
requires-comfyui = ">=0.23.0"
includes = ["example_workflows"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--confcutdir=tests"
