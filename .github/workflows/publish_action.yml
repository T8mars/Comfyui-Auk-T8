name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish Custom Node to Registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Check whether this version is already published
        id: registry-version
        shell: bash
        run: |
          set -euo pipefail
          current_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml | head -n 1)"
          versions="$(curl --silent --show-error --fail \
            "https://api.comfy.org/nodes/auk-t8/versions")"
          if jq -e --arg version "${current_version}" \
            'any(.[]; .version == $version)' <<<"${versions}" >/dev/null; then
            echo "exists=true" >>"${GITHUB_OUTPUT}"
          else
            echo "exists=false" >>"${GITHUB_OUTPUT}"
          fi
      - name: Publish custom node
        if: steps.registry-version.outputs.exists != 'true'
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
      - name: Update release notes and deprecate bridge releases
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.comfy.org"
          publisher="t8star"
          node="auk-t8"
          auth="Authorization: Bearer ${REGISTRY_ACCESS_TOKEN}"

          get_version_id() {
            local version="$1"
            local version_id=""
            for _ in {1..12}; do
              version_id="$(curl --silent --show-error --fail \
                "${api}/nodes/${node}/versions?cacheBust=$(date +%s%N)" | \
                jq -r --arg version "${version}" \
                  '.[] | select(.version == $version) | .id' | head -n 1)" || true
              if [[ -n "${version_id}" ]]; then
                printf '%s' "${version_id}"
                return 0
              fi
              sleep 5
            done
            echo "Registry version ${version} was not readable after publication" >&2
            return 1
          }

          current_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml | head -n 1)"
          current_id="$(get_version_id "${current_version}")"

          curl --fail-with-body --retry 3 --request PUT \
            --url "${api}/publishers/${publisher}/nodes/${node}/versions/${current_id}" \
            --header "${auth}" \
            --header "Content-Type: application/json" \
            --data '{"changelog":"Replaces the AuK Local HTTP bridge with native ComfyUI V3 nodes. Models now load directly from ComfyUI/models/auk with staged ComfyUI memory management; port 7860 and service tokens are no longer required.","deprecated":false}'

          for old_version in 1.0.0 1.0.1 1.0.2; do
            old_id="$(get_version_id "${old_version}")"
            if [[ -n "${old_id}" ]]; then
              curl --fail-with-body --retry 3 --request PUT \
                --url "${api}/publishers/${publisher}/nodes/${node}/versions/${old_id}" \
                --header "${auth}" \
                --header "Content-Type: application/json" \
                --data '{"changelog":"Superseded by native release 2.0.0. This version requires the separate AuK Local HTTP service.","deprecated":true}'
            fi
          done
